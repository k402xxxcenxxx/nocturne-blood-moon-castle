name: 數值調整／雜項
description: 不需要提案核准的數值調整、文件或工具工作
labels: []
body:
  - type: dropdown
    id: kind
    attributes:
      label: 類型
      options: ["type:tuning 數值調整", "type:chore 文件、工具、重構"]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: 要做什麼、為什麼
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: 完成條件
    validations: { required: true }
